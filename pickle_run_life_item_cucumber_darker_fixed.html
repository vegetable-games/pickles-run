<script>
const IMG_SRC = "assets/images/pickle.png";
const COSTUME_IMAGE_SRC = {
  1: "assets/images/costume1.png",
  2: "assets/images/costume2.png",
  3: "assets/images/costume3.png",
  4: "assets/images/costume4.png"
};
const LOGO_FULL_SRC = "assets/images/logo-full.png";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const coinCountEl = document.getElementById('coinCount');
const livesEl = document.getElementById('livesHud');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const tapHint = document.getElementById('tapHint');
const costumeBar = document.getElementById('costumeBar');
const muteBtn = document.getElementById('muteBtn');
const unlockToast = document.getElementById('unlockToast');
const powerBarWrap = document.getElementById('powerBarWrap');
const powerBarFill = document.getElementById('powerBarFill');
const wrapEl = document.getElementById('wrap');
const openingScreen = document.getElementById('openingScreen');
const resultPanel = overlay.querySelector('.panel');
const openingBestEl = document.getElementById('openingBest');
const openingCoinsEl = document.getElementById('openingCoins');
const openingSkinsEl = document.getElementById('openingSkins');
const openingMuteBtn = document.getElementById('openingMuteBtn');
const settingsBtn = document.getElementById('settingsBtn');
const costumeBtn = document.getElementById('costumeBtn');
const helpBtn = document.getElementById('helpBtn');
const openingToast = document.getElementById('openingToast');

let DPR = Math.min(window.devicePixelRatio || 1, 2);
let CW = 480, CH = 720;

function resize() {
  const viewport = window.visualViewport;
  const availW = Math.round(viewport ? viewport.width : window.innerWidth);
  const availH = Math.round(viewport ? viewport.height : window.innerHeight);
  document.documentElement.style.setProperty('--app-height', availH + 'px');
  const aspect = 3/4;
  let w = availW, h = availW/aspect;
  if (availH / availW > 1 / aspect) {
    h = availH;
    w = availW;
    CH = Math.round(CW * h / w);
  } else {
    CH = 720;
    if (h > availH) { h = availH; w = availH*aspect; }
  }
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  canvas.width = CW*DPR; canvas.height = CH*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

const pickleImg = new Image();
pickleImg.src = IMG_SRC;
let imgReady = false;
pickleImg.onload = () => { imgReady = true; };

const costumeImgs = {};
const costumeImgReady = {};
const costumeBrightImgs = {};
[1,2,3,4].forEach(i => {
  const im = new Image();
  im.src = COSTUME_IMAGE_SRC[i];
  costumeImgReady[i] = false;
  im.onload = () => {
    costumeImgReady[i] = true;
    costumeBrightImgs[i] = makeBrightImage(im);
  };
  costumeImgs[i] = im;
});

function makeBrightImage(sourceImg) {
  const c = document.createElement('canvas');
  c.width = sourceImg.naturalWidth || sourceImg.width;
  c.height = sourceImg.naturalHeight || sourceImg.height;
  const cctx = c.getContext('2d');
  cctx.drawImage(sourceImg, 0, 0);
  const imageData = cctx.getImageData(0, 0, c.width, c.height);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] === 0) continue;
    data[i] = Math.min(255, data[i] * 1.22 + 18);
    data[i + 1] = Math.min(255, data[i + 1] * 1.22 + 18);
    data[i + 2] = Math.min(255, data[i + 2] * 1.22 + 18);
  }
  cctx.putImageData(imageData, 0, 0);
  return c;
}

const logoFullEl = document.getElementById('logoFull');
if (logoFullEl) logoFullEl.src = LOGO_FULL_SRC;

// ---- Costume system (real costume artwork) ----
const COSTUMES = [

  { id:4, name:'キャップ＆ネックレス', imgKey:4, unlockCoins:5000 }
];

async function ensureAudio() {
  if (!actx) {

  }
  if (actx.state === 'suspended') {

function tone(freq, dur, type, vol, delay) {
  if (muted || !actx) return;
  const t0 = actx.currentTime + (delay||0);
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime((vol||0.15) * 0.65, t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}

function hexToRgb(hex) {
  const h = hex.replace('#','');
  return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
}
function lerp(a,b,t){ return a+(b-a)*t; }
function lerpHex(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const r = Math.round(lerp(a[0],b[0],t)), g = Math.round(lerp(a[1],b[1],t)), bl = Math.round(lerp(a[2],b[2],t));
  return 'rgb('+r+','+g+','+bl+')';
}
function lerpRgbStr(strA, strB, t) {
  const a = strA.split(',').map(Number), b = strB.split(',').map(Number);
  return Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t));
}

function getSceneInfo(distance) {
  const local = ((distance % CYCLE_LENGTH) + CYCLE_LENGTH) % CYCLE_LENGTH;
  let idx = 0;
  for (let i=STAGES.length-1;i>=0;i--) { if (local >= STAGES[i].start) { idx = i; break; } }
  const nextIdx = (idx+1) % STAGES.length;
  const nextThreshold = idx === STAGES.length-1 ? CYCLE_LENGTH : STAGES[nextIdx].start;
  let t = 0;
  if (local >= nextThreshold - TRANSITION_M) {
    t = (local - (nextThreshold - TRANSITION_M)) / TRANSITION_M;
    t = Math.max(0, Math.min(1, t));
  }
  const loopCount = Math.floor(distance / CYCLE_LENGTH);
  return { idx, nextIdx, t, stageKey: loopCount*100+idx, cur: STAGES[idx], next: STAGES[nextIdx] };
}

  else if (roll < 0.82) heightAbove = 95 + Math.random()*35;
  else heightAbove = 150 + Math.random()*30;
  coinsOnField.push({ x: CW+20, y: gy - heightAbove, r: 12, spin:0 });
}

function rectsOverlap(a,b) {
  const pad = 10;
  return a.x+pad < b.x+b.w && a.x+a.w-pad > b.x && a.y+pad < b.y+b.h && a.y+a.h-pad > b.y;
}
function circleRectOverlap(cx,cy,cr, r) {
  const nx = Math.max(r.x, Math.min(cx, r.x+r.w));
  const ny = Math.max(r.y, Math.min(cy, r.y+r.h));
  const dx = cx-nx, dy = cy-ny;
  return dx*dx+dy*dy < cr*cr;
}

    .toLowerCase()

function startOfWeekISO() {
  const now = new Date();
  const day = now.getDay(); // 0=Sun,1=Mon,...6=Sat
  const diffToMonday = (day === 0 ? 6 : day - 1);
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday, 0, 0, 0, 0);
  return monday.toISOString();
}

function specialStrength(scene, key) {
  let s = 0;
  if (scene.cur.special === key) s = Math.max(s, 1 - scene.t);
  if (scene.next.special === key) s = Math.max(s, scene.t);
  return s;
}

    ctx.ellipse(x + 3 * scale, y + 10 * scale, 44 * scale, 16 * scale, 0, 0, Math.PI * 2);

  function drawMountainBand(yBase, amp, colorA, colorB, alpha, scroll, seed) {

      ctx.quadraticCurveTo(px + 42, peak, px + 76, shoulder);

    ctx.fillStyle = '#9f403a';

    ctx.fill();
    ctx.fillStyle = '#b48a63';

      ctx.lineTo(4 * scale, 0);
      ctx.lineTo(2 * scale, -32 * scale);

      ctx.fill();
      ctx.strokeStyle = '#ccbba0';

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -32 * scale);

    }
    ctx.fillStyle = '#a17858';
    ctx.beginPath(); ctx.arc(0, 0, 4 * scale, 0, Math.PI * 2); ctx.fill();

  }

  function drawFenceBand(y, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    for (let x = fenceScroll - 94; x < CW + 94; x += 94) {
      ctx.fillStyle = '#eceadf';
      ctx.fillRect(x + 10, y - 20, 6, 27);

  ctx.save();
  if (dreamStrength > 0.01) {
    const local = ((score % CYCLE_LENGTH) + CYCLE_LENGTH) % CYCLE_LENGTH;
    const dreamLocal = local >= DREAM_START ? local - DREAM_START : 0;
    const angle = (dreamLocal / (CYCLE_LENGTH - DREAM_START)) * 360;
    ctx.filter = 'hue-rotate(' + (angle * dreamStrength) + 'deg)';

  ctx.clearRect(0, 0, CW, CH);

  if (daylight > 0.06) {

    ctx.translate(CW - 74, sunY);
    ctx.globalAlpha = 0.16 * daylight;
    ctx.strokeStyle = 'rgba(' + sunGlowRgb + ',0.34)';

  }

  if (auroraStrength > 0.01) {
    const colors = ['rgba(120,255,190,ALPHA)', 'rgba(150,200,255,ALPHA)', 'rgba(200,150,255,ALPHA)'];
    colors.forEach((c, i) => {
      const a = 0.18 * auroraStrength;
      ctx.strokeStyle = c.replace('ALPHA', a.toFixed(3));
      ctx.lineWidth = 14;
      ctx.beginPath();
      const yBase = 60 + i * 26;
      for (let x = 0; x <= CW; x += 20) {
        const y = yBase + Math.sin((x * 0.02) + scenePhase * 0.0016 + i * 1.4) * 18;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    });
  }

  if (blackholeStrength > 0.01) {
    const bx = CW - 72, by = sunY;
    for (let ring = 3; ring >= 1; ring--) {
      ctx.strokeStyle = 'rgba(255,' + (60 + ring * 30) + ',40,' + (0.25 * blackholeStrength / ring) + ')';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(bx, by, 30 + ring * 16, 10 + ring * 5, scenePhase * 0.0005, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  ctx.save();
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = 'rgba(' + sunGlowRgb + ',0.36)';
  ctx.beginPath(); ctx.arc(CW - 74, sunY, 62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = sunColor;
  ctx.beginPath(); ctx.arc(CW - 74, sunY, 39, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // painterly cloud layer
  clouds.forEach((c, i) => {
    c.x -= speed * (0.18 + 0.04 * c.s) * dt;
    if (c.x < -120) { c.x = CW + 120; c.y = 28 + Math.random() * 150; }
    drawSoftCloud(c.x, c.y, 0.92 * c.s + 0.28, 0.72 + (i % 2) * 0.10);
  });

  // far and mid scenery
  drawMountainBand(horizonY - 26, 66, '#6d90c3', '#5079b1', 0.62 + daylight * 0.24, farScroll, 180);
  drawHillBand(horizonY + 16, 22, '#a8d77a', '#83c95c', 0.82, midScroll * 0.82, 90);
  drawHillBand(horizonY + 48, 32, '#87cb5a', '#68b147', 0.94, midScroll, 220);
  drawHillBand(horizonY + 82, 42, '#70b047', '#57953d', 1.0, nearScroll, 340);

  // lake ribbon
  ctx.save();
  ctx.globalAlpha = 0.82 * (0.45 + daylight * 0.55);
  const waterGrad = ctx.createLinearGradient(0, horizonY + 36, 0, horizonY + 86);
  waterGrad.addColorStop(0, '#8bd5ef');
  waterGrad.addColorStop(1, '#50a5d2');
  ctx.fillStyle = waterGrad;
  for (let pass = 0; pass < 2; pass++) {
    const wx = (nearScroll * 0.55) + pass * (CW + 260);
    ctx.beginPath();
    ctx.moveTo(CW * 0.18 + wx, horizonY + 58);
    ctx.quadraticCurveTo(CW * 0.29 + wx, horizonY + 34, CW * 0.42 + wx, horizonY + 56);
    ctx.quadraticCurveTo(CW * 0.51 + wx, horizonY + 71, CW * 0.60 + wx, horizonY + 62);
    ctx.lineTo(CW * 0.60 + wx, horizonY + 80);
    ctx.quadraticCurveTo(CW * 0.46 + wx, horizonY + 74, CW * 0.29 + wx, horizonY + 88);
    ctx.quadraticCurveTo(CW * 0.20 + wx, horizonY + 76, CW * 0.18 + wx, horizonY + 58);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(CW * 0.24 + wx, horizonY + 67);
    ctx.quadraticCurveTo(CW * 0.36 + wx, horizonY + 54, CW * 0.53 + wx, horizonY + 68);
    ctx.stroke();
  }
  ctx.restore();

  // single farm cluster on the midground
  const farmAlpha = 0.38 + daylight * 0.55;
  for (let pass = 0; pass < 2; pass++) {
    drawFarmCluster(CW * 0.62 + nearScroll * 0.55 + pass * (CW + 320), horizonY + 18, 0.95, farmAlpha);
  }

  if (fireflyStrength > 0.01) {
    fireflies.forEach(f => {
      f.x -= speed * 0.18 * dt;
      if (f.x < -6) f.x = CW + 6;
      f.phase += dt * 0.0025;
      const bob = Math.sin(f.phase) * 10;
      ctx.globalAlpha = fireflyStrength * (0.4 + 0.6 * Math.abs(Math.sin(f.phase * 1.7)));
      ctx.fillStyle = '#fff6b0';
      ctx.beginPath(); ctx.arc(f.x, f.y + bob, 2.6, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // ground top turf
  const turfH = 16;
  const soilTop = gy + turfH;
  const grassGrad = ctx.createLinearGradient(0, gy - 8, 0, soilTop + 8);
  grassGrad.addColorStop(0, '#d0f264');
  grassGrad.addColorStop(0.26, '#9fe13e');
  grassGrad.addColorStop(1, '#5ea628');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, gy - 5, CW, turfH + 9);
  ctx.fillStyle = 'rgba(255,255,255,0.20)';
  ctx.fillRect(0, gy - 4, CW, 3);
  ctx.fillStyle = 'rgba(76,126,31,0.45)';
  ctx.fillRect(0, gy + 11, CW, 2);

  groundOffset -= speed * dt;
  if (groundOffset < -64) groundOffset += 64;

  // broad moving grass shadows only, to avoid jittery detail
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#4b8b28';
  for (let x = groundOffset - 64; x < CW + 64; x += 64) {
    ctx.beginPath();
    ctx.moveTo(x, gy + 2);
    ctx.quadraticCurveTo(x + 18, gy - 4, x + 34, gy + 2);
    ctx.quadraticCurveTo(x + 50, gy + 7, x + 64, gy + 1);
    ctx.lineTo(x + 64, gy + 10);
    ctx.lineTo(x, gy + 10);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // dirt cross-section with gentle layering
  const dirtGrad = ctx.createLinearGradient(0, soilTop, 0, CH);
  dirtGrad.addColorStop(0, '#9b6630');
  dirtGrad.addColorStop(0.42, '#7b4c21');
  dirtGrad.addColorStop(1, '#553015');
  ctx.fillStyle = dirtGrad;
  ctx.fillRect(0, soilTop, CW, CH - soilTop);

  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = '#5d3717';
  ctx.lineWidth = 10;
  for (let y = soilTop + 22; y < CH; y += 34) {
    ctx.beginPath();
    ctx.moveTo(-20, y);
    ctx.quadraticCurveTo(CW * 0.28, y + 6, CW * 0.52, y - 4);
    ctx.quadraticCurveTo(CW * 0.76, y - 10, CW + 20, y + 2);
    ctx.stroke();
  }
  ctx.restore();


  ctx.restore();
}

function drawPlayer() {
  ctx.save();
  const cx = player.x+player.w/2, cy = player.y+player.h/2;
  ctx.translate(cx,cy); ctx.rotate(player.rotation);

  let alpha = 1;
  if (player.invincible) {
    if (player.invincibleTimer < 2000) {
      alpha = (Math.floor(scenePhase/90) % 2 === 0) ? 1 : 0.35;
    }
    ctx.save();
    ctx.globalAlpha = 0.35 * (player.invincibleTimer<2000 ? alpha : 1);
    ctx.fillStyle = '#e0a84a';
    ctx.beginPath(); ctx.arc(0, 0, player.w*0.72, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else if (player.hitInvuln) {
    alpha = (Math.floor(scenePhase/70) % 2 === 0) ? 1 : 0.3;
  }

  ctx.globalAlpha = alpha;
  const costume = COSTUMES.find(c=>c.id===activeCostume) || COSTUMES[0];
  let drawImg = pickleImg, drawReady = imgReady;
  if (costume.imgKey !== null) {
    drawImg = costumeImgs[costume.imgKey];
    drawReady = costumeImgReady[costume.imgKey];
  }
  if (!drawReady && imgReady) { drawImg = pickleImg; drawReady = true; }
  if (drawReady) {
    // Keep the aspect ratio, with small per-costume visual tuning to match the normal pickle.
    if (costume.imgKey !== null && costumeBrightImgs[costume.imgKey]) {
      drawImg = costumeBrightImgs[costume.imgKey];
    }
    const iw = drawImg.naturalWidth || drawImg.width;
    const ih = drawImg.naturalHeight || drawImg.height;
    let dh = player.h;
    let dw = iw * (dh/ih);
    const costumeScale = { 1: 1.08, 2: 0.98, 3: 1.04, 4: 1.08 }[costume.imgKey] || 1;
    dh *= costumeScale;
    dw *= costumeScale;
    ctx.filter = costume.imgKey === null ? 'brightness(0.98)' : 'none';
    ctx.drawImage(drawImg, -dw/2, -dh/2, dw, dh);
    ctx.filter = 'none';
  } else {
    ctx.fillStyle = '#a8e05a';
    ctx.beginPath(); ctx.roundRect(-player.w/2,-player.h/2,player.w,player.h,player.w/2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  const gy = GROUND_Y();
  const shrink = Math.max(0.3, 1-(gy-(player.y+player.h))/220);
  ctx.save(); ctx.globalAlpha = 0.25*shrink; ctx.fillStyle = '#2a4a2a';
  ctx.beginPath(); ctx.ellipse(player.x+player.w/2, gy+6, (player.w/2)*shrink, 8*shrink, 0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawObstacle(o) {
  ctx.save(); ctx.fillStyle = o.color;
  if (o.type==='carrot') {
    ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(o.x+o.w,o.y); ctx.lineTo(o.x+o.w/2,o.y+o.h); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#3a8a3a'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(o.x+o.w/2-4,o.y-10); ctx.lineTo(o.x+o.w/2,o.y);
    ctx.moveTo(o.x+o.w/2+4,o.y-12); ctx.lineTo(o.x+o.w/2,o.y); ctx.stroke();

  } else if (o.type==='eggplant') {
    // rounded purple body, slightly curved
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2, o.y+o.h*0.58, o.w/2, o.h*0.46, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2-6, o.y+o.h*0.45, o.w/6, o.h/6, 0, 0, Math.PI*2); ctx.fill();
    // green calyx (cap)
    ctx.fillStyle = '#4a9a4a';
    ctx.beginPath();
    ctx.moveTo(o.x+o.w*0.3, o.y+6);
    ctx.lineTo(o.x+o.w*0.7, o.y+6);
    ctx.lineTo(o.x+o.w*0.5, o.y-8);
    ctx.closePath(); ctx.fill();

  } else if (o.type==='corn') {
    // tall yellow cob with kernel dots
    ctx.beginPath();
    ctx.moveTo(o.x+o.w*0.15, o.y+o.h);
    ctx.quadraticCurveTo(o.x-4, o.y+o.h*0.4, o.x+o.w*0.5, o.y+4);
    ctx.quadraticCurveTo(o.x+o.w+4, o.y+o.h*0.4, o.x+o.w*0.85, o.y+o.h);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(160,110,0,0.35)';
    for (let ry=o.y+16; ry<o.y+o.h-6; ry+=10) {
      for (let rx=o.x+6; rx<o.x+o.w-4; rx+=8) {
        ctx.beginPath(); ctx.arc(rx, ry, 1.6, 0, Math.PI*2); ctx.fill();
      }
    }
    // green husk leaves at base
    ctx.fillStyle = '#3f9a4a';
    ctx.beginPath();
    ctx.moveTo(o.x-2, o.y+o.h);
    ctx.lineTo(o.x+o.w*0.35, o.y+o.h*0.62);
    ctx.lineTo(o.x+o.w*0.4, o.y+o.h);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(o.x+o.w+2, o.y+o.h);
    ctx.lineTo(o.x+o.w*0.65, o.y+o.h*0.62);
    ctx.lineTo(o.x+o.w*0.6, o.y+o.h);
    ctx.closePath(); ctx.fill();

  } else if (o.type==='pumpkin') {
    // wide ridged pumpkin
    const cx = o.x+o.w/2, cy = o.y+o.h*0.58, rx = o.w/2, ry = o.h*0.44;
    ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(150,70,0,0.35)'; ctx.lineWidth = 2;
    for (let i=-2;i<=2;i++) {
      ctx.beginPath();
      ctx.ellipse(cx + i*(rx/3.2), cy, Math.max(2, rx/5), ry, 0, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.fillStyle = '#4a9a4a';
    ctx.fillRect(cx-3, o.y-8, 6, 12);

  } else if (o.type==='daikon') {
    // long pale radish lying on its side, leafy top on one end
    const cy = o.y + o.h/2;
    ctx.beginPath();
    ctx.moveTo(o.x, cy-o.h/2);
    ctx.lineTo(o.x+o.w*0.78, cy-o.h/2);
    ctx.quadraticCurveTo(o.x+o.w, cy-o.h/2, o.x+o.w, cy);
    ctx.quadraticCurveTo(o.x+o.w, cy+o.h/2, o.x+o.w*0.78, cy+o.h/2);
    ctx.lineTo(o.x, cy+o.h/2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(o.x+8,cy-o.h/2); ctx.lineTo(o.x+8,cy+o.h/2); ctx.stroke();
    // leaves sticking up from the near end
    ctx.fillStyle = '#4a9a4a';
    ctx.beginPath();
    ctx.moveTo(o.x, cy-o.h/2);
    ctx.lineTo(o.x-6, cy-o.h/2-16);
    ctx.lineTo(o.x+6, cy-o.h/2-2);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(o.x+6, cy-o.h/2);
    ctx.lineTo(o.x+12, cy-o.h/2-18);
    ctx.lineTo(o.x+16, cy-o.h/2-2);
    ctx.closePath(); ctx.fill();

  } else if (o.type==='broccoli') {
    // stem
    ctx.fillStyle = '#cfe0a0';
    ctx.fillRect(o.x+o.w*0.36, o.y+o.h*0.55, o.w*0.28, o.h*0.45);
    // bumpy green top
    ctx.fillStyle = o.color;
    const bumps = [[0.5,0.32,0.34],[0.24,0.46,0.24],[0.76,0.46,0.24],[0.5,0.55,0.22]];
    bumps.forEach(b => {
      ctx.beginPath();
      ctx.arc(o.x+o.w*b[0], o.y+o.h*b[1], o.w*b[2], 0, Math.PI*2);
      ctx.fill();
    });
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    bumps.forEach(b => {
      ctx.beginPath();
      ctx.arc(o.x+o.w*b[0]-2, o.y+o.h*b[1]-2, o.w*b[2]*0.4, 0, Math.PI*2);
      ctx.fill();
    });

  } else if (o.type==='ossan') {
    // 八百屋のおっちゃん：白い鉢巻＋緑の前掛け（「八」マーク）で歩いてくる敵
    const cx = o.x+o.w/2;
    const legPhase = Math.sin(o.x*0.045);
    const hipY = o.y+o.h*0.62;
    const legLen = o.h*0.36;
    // legs (walking animation via x-based phase)
    ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx-4, hipY); ctx.lineTo(cx-4+legPhase*8, hipY+legLen);
    ctx.moveTo(cx+4, hipY); ctx.lineTo(cx+4-legPhase*8, hipY+legLen);
    ctx.stroke();
    // undershirt / arms poking out (behind apron)
    ctx.fillStyle = '#f2e6d8';
    ctx.beginPath(); ctx.ellipse(o.x+o.w*0.14, o.y+o.h*0.42, 6, 11, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(o.x+o.w*0.86, o.y+o.h*0.42, 6, 11, -0.3, 0, Math.PI*2); ctx.fill();
    // body base (white shirt collar)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(o.x+o.w*0.22, o.y+o.h*0.32, o.w*0.56, o.h*0.14);
    // apron (green, with rounded bib top and string ties)
    ctx.fillStyle = '#2f8f6f';
    ctx.beginPath();
    ctx.moveTo(o.x+o.w*0.2, o.y+o.h*0.4);
    ctx.lineTo(o.x+o.w*0.8, o.y+o.h*0.4);
    ctx.lineTo(o.x+o.w*0.74, hipY+2);
    ctx.lineTo(o.x+o.w*0.26, hipY+2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#e8e0c8'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx-3, o.y+o.h*0.4); ctx.lineTo(cx-9, o.y+o.h*0.34);
    ctx.moveTo(cx+3, o.y+o.h*0.4); ctx.lineTo(cx+9, o.y+o.h*0.34);
    ctx.stroke();
    // "八" mark on apron (white circle)
    ctx.fillStyle = '#eef7ee';
    ctx.beginPath(); ctx.arc(cx, (o.y+o.h*0.4+hipY)/2, o.w*0.16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2f8f6f';
    ctx.font = `${Math.round(o.w*0.22)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('八', cx, (o.y+o.h*0.4+hipY)/2+1);
    // head
    ctx.fillStyle = o.color;
    ctx.beginPath(); ctx.arc(cx, o.y+o.h*0.2, o.w*0.32, 0, Math.PI*2); ctx.fill();
    // rosy cheeks
    ctx.fillStyle = 'rgba(255,140,140,0.55)';
    ctx.beginPath(); ctx.arc(cx-o.w*0.2, o.y+o.h*0.24, o.w*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+o.w*0.2, o.y+o.h*0.24, o.w*0.08, 0, Math.PI*2); ctx.fill();
    // hachimaki (white headband) with knot at the back
    ctx.fillStyle = '#fbfbf5';
    ctx.fillRect(o.x+o.w*0.08, o.y+o.h*0.1, o.w*0.84, o.h*0.1);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1;
    ctx.strokeRect(o.x+o.w*0.08, o.y+o.h*0.1, o.w*0.84, o.h*0.1);
    ctx.fillStyle = '#fbfbf5';
    ctx.beginPath();
    ctx.moveTo(o.x+o.w*0.88, o.y+o.h*0.09);
    ctx.lineTo(o.x+o.w*1.0, o.y+o.h*0.03);
    ctx.lineTo(o.x+o.w*0.97, o.y+o.h*0.17);
    ctx.closePath(); ctx.fill();
    // mustache
    ctx.fillStyle = '#4a3a2a';
    ctx.beginPath();
    ctx.moveTo(cx-8, o.y+o.h*0.24);
    ctx.lineTo(cx, o.y+o.h*0.21);
    ctx.lineTo(cx+8, o.y+o.h*0.24);
    ctx.lineTo(cx, o.y+o.h*0.26);
    ctx.closePath(); ctx.fill();
    // smiling eyes (closed, happy-curve style)
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(cx-6, o.y+o.h*0.19, 3, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+6, o.y+o.h*0.19, 3, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
  }
  ctx.restore();
}

function drawCoin(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  const squish = Math.max(0.25, Math.abs(Math.cos(c.spin)));
  ctx.scale(squish, 1);
  ctx.fillStyle = '#ffd54a';
  ctx.beginPath(); ctx.arc(0,0,c.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#e0a400'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawPlatformTile(t) {
  ctx.save();
  ctx.fillStyle = '#c98a4b';
  ctx.fillRect(t.x, t.y, t.w, t.h);
  ctx.strokeStyle = '#8a5a2c'; ctx.lineWidth = 2;
  ctx.strokeRect(t.x+1, t.y+1, t.w-2, t.h-2);
  ctx.beginPath();
  ctx.moveTo(t.x, t.y); ctx.lineTo(t.x+t.w, t.y+t.h);
  ctx.moveTo(t.x+t.w, t.y); ctx.lineTo(t.x, t.y+t.h);
  ctx.stroke();
  // little carrot decoration on top
  const cx = t.x+t.w/2;
  ctx.fillStyle = '#ff9a3d';
  ctx.beginPath();
  ctx.moveTo(cx-6, t.y-2); ctx.lineTo(cx+6, t.y-2); ctx.lineTo(cx, t.y-12);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4a9a4a';
  ctx.fillRect(cx-2, t.y-16, 4, 6);
  ctx.restore();
}

function drawDust() {
  dustParticles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life/500);
    ctx.fillStyle = '#c9a876';
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function drawJar(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  const bob = Math.sin(j.spin)*3;
  ctx.translate(0, bob);
  // glass jar body
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.strokeStyle = '#d8c8a0';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(-11, -14, 22, 26, 4);
  ctx.fill(); ctx.stroke();
  // brine liquid inside
  ctx.fillStyle = '#a8752f';
  ctx.beginPath();
  ctx.roundRect(-9, -3, 18, 14, 3);
  ctx.fill();
  // lid
  ctx.fillStyle = '#8a5a2c';
  ctx.fillRect(-9, -18, 18, 6);
  // sparkle
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(-4, -8, 2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawLifeItem(item) {
  ctx.save();
  ctx.translate(item.x, item.y + Math.sin(item.spin) * 4);

  // 無敵の酢アイテムと同じく、囲いなしの単体表示
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 影
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(2, 20, 16, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // きゅうり本体（絵文字のまま、色を少し濃く調整）
  ctx.save();
  ctx.filter = 'saturate(1.55) contrast(1.12) brightness(0.92)';
  ctx.font = '900 30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText('🥒', 0, -2);
  ctx.restore();

  // ×1 表示
  ctx.font = '900 14px "Hiragino Sans","Yu Gothic",sans-serif';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#5a9f34';
  ctx.fillStyle = '#ffffff';
  ctx.strokeText('×1', 18, -11);
  ctx.fillText('×1', 18, -11);

  ctx.restore();
}

function drawSplash() {
  splashParticles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life/500);
    ctx.fillStyle = p.color || '#b8863f';
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function loop(ts) {
  if (!running) return;
  const dt = Math.min(ts-lastTs, 40);
  lastTs = ts; elapsed += dt;

  speed = baseSpeed + Math.min(elapsed/1000,60)*0.0024;
  score += speed*dt*0.05;
  scoreEl.textContent = Math.floor(score)+' m';

  drawBackground(dt);

  // jump-cut variable height: if released early during ascent, dampen upward velocity
  if (!isHolding && player.jumping && player.vy < -0.3 && (performance.now()-holdStart) < 260) {
    player.vy *= 0.55;
  }
  const prevTop = player.y;
  player.vy += GRAVITY*dt;
  player.y += player.vy*dt;
  const gy = GROUND_Y();

  // head bonk: moving upward into the underside of a block
  if (player.vy < 0) {
    for (let i=0;i<platformTiles.length;i++) {
      const t = platformTiles[i];
      const tileBottom = t.y + t.h;
      if (player.x+player.w > t.x && player.x < t.x+t.w && prevTop >= tileBottom && player.y < tileBottom) {
        player.y = tileBottom;
        player.vy = 0.18;
        sfxBonk();
        break;
      }
    }
  }

  // find support surface: an elevated platform tile under the player, else base ground
  let supportY = gy;
  for (let i=0;i<platformTiles.length;i++) {
    const t = platformTiles[i];
    if (player.x+player.w > t.x && player.x < t.x+t.w && player.y+player.h <= t.y+10) {
      supportY = t.y; break;
    }
  }
  if (player.y+player.h >= supportY) {
    const landedElevated = supportY < gy-1;
    if (inBlockSection && player.onElevated && !landedElevated) {
      triggerStumble();
    }
    player.onElevated = landedElevated;
    player.y = supportY-player.h; player.vy = 0;
    if (player.jumping) { player.jumping=false; player.usedDoubleJump=false; }
  }
  player.rotation = player.jumping ? Math.max(-0.35, player.vy*0.12) : 0;

  // invincibility timer & splash emission
  if (player.invincible) {
    player.invincibleTimer -= dt;
    emitSplash();
    powerBarWrap.classList.add('show');
    powerBarFill.style.width = Math.max(0, (player.invincibleTimer/INVINCIBLE_DURATION)*100) + '%';
    if (player.invincibleTimer <= 0) {
      player.invincible = false;
      powerBarWrap.classList.remove('show');
      playFileSfx('invincibleEnd', 0.68);
      startBgm(260);
    }
  }
  if (player.hitInvuln) {
    player.hitInvulnTimer -= dt;
    if (player.hitInvulnTimer <= 0) { player.hitInvuln = false; }
  }

  lastSpawn += dt;
  if (!inBlockSection && lastSpawn > spawnGap) { spawnObstacle(); lastSpawn=0; spawnGap = Math.max(520, 1300-elapsed/45 + (Math.random()*420-160)); }
  lastCoinSpawn += dt;
  if (!inBlockSection && lastCoinSpawn > coinSpawnGap) { spawnCoin(); lastCoinSpawn=0; coinSpawnGap = 700+Math.random()*700; }

  if (score >= nextJarAt) {
    spawnJar();
    jarSpawnIndex++;
    nextJarAt = jarThreshold(jarSpawnIndex);
  }

  if (score >= nextLifeItemAt) {
    spawnLifeItem();
    lifeItemSpawnIndex++;
    nextLifeItemAt = lifeItemThreshold(lifeItemSpawnIndex);
  }

  if (!inBlockSection && score >= nextSectionAt) {
    spawnBlockSection();
    nextSectionAt = score + 420 + Math.random()*260;
  }

  for (let i=platformTiles.length-1;i>=0;i--) {
    const t = platformTiles[i];
    t.x -= speed*dt;
    drawPlatformTile(t);
    if (t.x+t.w < -20) platformTiles.splice(i,1);
  }
  if (inBlockSection && platformTiles.length===0) {
    inBlockSection = false; lastSpawn = 0; lastCoinSpawn = 0;
  }

  for (let i=dustParticles.length-1;i>=0;i--) {
    const p = dustParticles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.0004*dt; p.life -= dt;
    if (p.life <= 0) dustParticles.splice(i,1);
  }
  drawDust();

  for (let i=obstacles.length-1;i>=0;i--) {
    const o = obstacles[i];
    o.x -= (speed + (o.extraSpeed||0))*dt;
    const pBox = {x:player.x+10,y:player.y+8,w:player.w-20,h:player.h-12};
    if (rectsOverlap(pBox,o)) {
      if (player.invincible) {
        burstObstacle(o);
        sfxCrush();
        score += 15;
        obstacles.splice(i,1);
        continue;
      } else if (player.hitInvuln) {
        // ライフ消費直後の一時無敵中はすり抜ける
      } else if (lives > 0) {
        lives--; const livesCountEl = document.getElementById('livesCount'); if (livesCountEl) livesCountEl.textContent = lives; updateLivesHud();
        player.hitInvuln = true; player.hitInvulnTimer = 1500;
        sfxHit();
        showToast('ライフを使った！残り' + lives);
        obstacles.splice(i,1);
        continue;
      } else {
        endGame();
      }
    }
    drawObstacle(o);
    if (o.x+o.w < -20) obstacles.splice(i,1);
  }

  for (let i=lifeItemsOnField.length-1;i>=0;i--) {
    const item = lifeItemsOnField[i];
    item.x -= speed*dt;
    item.spin += dt*0.0045;
    const pBox = {x:player.x+8,y:player.y+8,w:player.w-16,h:player.h-16};
    if (circleRectOverlap(item.x,item.y,item.r,pBox)) {
      gainLife();
      lifeItemsOnField.splice(i,1);
      continue;
    }
    drawLifeItem(item);
    if (item.x < -35) lifeItemsOnField.splice(i,1);
  }

  for (let i=jarsOnField.length-1;i>=0;i--) {
    const j = jarsOnField[i];
    j.x -= speed*dt; j.spin += dt*0.004;
    const pBox = {x:player.x+8,y:player.y+8,w:player.w-16,h:player.h-16};
    if (circleRectOverlap(j.x,j.y,j.r,pBox)) {
      activateInvincible();
      jarsOnField.splice(i,1);
      continue;
    }
    drawJar(j);
    if (j.x < -20) jarsOnField.splice(i,1);
  }

  for (let i=splashParticles.length-1;i>=0;i--) {
    const p = splashParticles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.0003*dt; p.life -= dt;
    if (p.life <= 0) splashParticles.splice(i,1);
  }
  drawSplash();

  for (let i=coinsOnField.length-1;i>=0;i--) {
    const c = coinsOnField[i];
    c.x -= speed*dt; c.spin += dt*0.01;
    const pBox = {x:player.x+8,y:player.y+8,w:player.w-16,h:player.h-16};
    if (circleRectOverlap(c.x,c.y,c.r,pBox)) {
      coinsThisRun++; coinCountEl.textContent = coinsThisRun;
      lifeCoinProgress++;
      if (lifeCoinProgress >= LIFE_COIN_INTERVAL) { lifeCoinProgress -= LIFE_COIN_INTERVAL; gainLife(); }
      sfxCoin();
      coinsOnField.splice(i,1);
      continue;
    }
    drawCoin(c);
    if (c.x < -20) coinsOnField.splice(i,1);
  }

  drawPlayer();
  if (running) requestAnimationFrame(loop);
}

function showOpeningModal(title, html, openingTheme) {
  openingScreen.classList.add('hidden');
  overlay.classList.toggle('opening-modal-theme', !!openingTheme);
  resultPanel.classList.remove('hidden');
  resultPanel.innerHTML = '<h1>' + title + '</h1><p>' + html + '</p><button class="btn modalClose" id="openingModalClose">もどる</button>';
  document.getElementById('openingModalClose').addEventListener('click', () => {
    overlay.classList.remove('opening-modal-theme');
    resultPanel.classList.add('hidden'); openingScreen.classList.remove('hidden');
    requestTitleAudioStart();
  });
}
if (helpBtn) helpBtn.addEventListener('click', () => showOpeningModal('遊び方', '長押しで高くジャンプ！<br>空中でもう一度タップでWジャンプ！<br>野菜の障害物をよけて記録を伸ばそう！<br>コインを集めて新しい衣装を解放！<br>無敵アイテムと1UPを見つけたら必ずゲット！', true));
if (settingsBtn) settingsBtn.addEventListener('click', () => showOpeningModal('⚙️ 設定', '右上のスピーカーボタンでサウンドのON／OFFを切り替えられます。<br>ベスト記録・コイン・衣装はこのブラウザに保存されます。', false));
if (costumeBtn) costumeBtn.addEventListener('click', () => {
  renderLeaderboardPanel(best, 'weekly', true);
});

startBtn.addEventListener('click', startGame);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!started) startGame(); else beginJump(); }
});
window.addEventListener('keyup', (e) => { if (e.code === 'Space') endJump(); });
canvas.addEventListener('pointerdown', (e) => { if (!started) return; beginJump(); });
canvas.addEventListener('pointerup', endJump);
canvas.addEventListener('pointercancel', endJump);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); }, {passive:false});

resize();
resetGame();
syncOpeningStats();
renderOpeningSkins();
drawBackground(0);
drawPlayer();
</script>
